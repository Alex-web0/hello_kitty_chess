name: Firebase Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: salehpassionprojects
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SALEHPASSIONPROJECTS }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Hosting and Realtime Database rules
        run: firebase deploy --only hosting,database --project "$FIREBASE_PROJECT_ID" --non-interactive
